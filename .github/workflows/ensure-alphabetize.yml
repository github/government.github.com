name: Ensure entries are alphabetized
permissions:
  contents: read

on:
  push:
    branches: [gh-pages]
    paths:
      - "Gemfile"
      - "script/alphabetize"
      - "script/suggest-alphabetize"
      - "lib/alphabetize*.rb"
      - "test/alphabetize_suggestions_test.rb"
      - ".github/workflows/ensure-alphabetize.yml"
      - "_data/**"
  pull_request:
    paths:
      - "Gemfile"
      - "script/alphabetize"
      - "script/suggest-alphabetize"
      - "lib/alphabetize*.rb"
      - "test/alphabetize_suggestions_test.rb"
      - ".github/workflows/ensure-alphabetize.yml"
      - "_data/**"

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Ruby
      uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
      with:
        bundler-cache: true
    - name: Test formatting suggestions
      run: bundle exec ruby test/alphabetize_suggestions_test.rb
    - name: Ensure Orgs are sorted
      run: |
        bundle exec script/alphabetize
        git diff --color --exit-code
