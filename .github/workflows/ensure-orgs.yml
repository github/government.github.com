name: Ensure entries are GitHub Orgs
permissions:
  contents: read

on:
  schedule:
    - cron: "23 6 1 * *"
  workflow_dispatch:
  push:
    branches: [gh-pages]
    paths:
      - "Gemfile"
      - "script/ensure-orgs"
      - "test/ensure_orgs_test.rb"
      - ".github/workflows/ensure-orgs.yml"
      - "_data/**"
  pull_request:
    paths:
      - "Gemfile"
      - "script/ensure-orgs"
      - "test/ensure_orgs_test.rb"
      - ".github/workflows/ensure-orgs.yml"
      - "_data/**"

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - name: Set up Ruby
      uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
      with:
        bundler-cache: true
    - name: Test organization checks
      run: bundle exec ruby test/ensure_orgs_test.rb
    - name: Ensure data entries are GitHub Orgs
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        ORG_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: bundle exec script/ensure-orgs
