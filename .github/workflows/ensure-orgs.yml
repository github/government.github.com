name: Ensure entries are GitHub Orgs
permissions:
  contents: read

on:
  push:
    paths:
      - "Gemfile"
      - "script/ensure-orgs"
      - ".github/workflows/ensure-orgs.yml"
      - "_data/**"
  pull_request:
    paths:
      - "Gemfile"
      - "script/ensure-orgs"
      - ".github/workflows/ensure-orgs.yml"
      - "_data/**"

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Ruby
      uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
      with:
        bundler-cache: true
    - name: Ensure data entries are GitHub Orgs
      run: bundle exec script/ensure-orgs
