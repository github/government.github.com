name: Ensure entries are GitHub Orgs
permissions:
  contents: read

on:
  push:
    paths:
      - "Gemfile"
      - "script/ensure-orgs"
      - ".github/workflows/ensure-orgs.yml"
      - "_data/**"
  pull_request:
    paths:
      - "Gemfile"
      - "script/ensure-orgs"
      - ".github/workflows/ensure-orgs.yml"
      - "_data/**"

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Ruby
      uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
      with:
        bundler-cache: true
    - name: Ensure data entries are GitHub Orgs
      run: bundle exec script/ensure-orgs
