name: Ensure entries are unique
permissions:
  contents: read

on:
  push:
    paths:
      - "Gemfile"
      - "script/ensure-unique"
      - ".github/workflows/ensure-unique.yml"
      - "_data/**"
  pull_request:
    paths:
      - "Gemfile"
      - "script/ensure-unique"
      - ".github/workflows/ensure-unique.yml"
      - "_data/**"

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Ruby
      uses: ruby/setup-ruby@e8944e80fb94b20106697132f8c20c665fab29e9 # v1.325.0
      with:
        bundler-cache: true
    - name: Ensure Orgs are unique
      run: bundle exec script/ensure-unique
