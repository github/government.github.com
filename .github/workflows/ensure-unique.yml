name: Ensure entries are unique
permissions:
  contents: read

on:
  push:
    branches: [gh-pages]
    paths:
      - "Gemfile"
      - "script/ensure-unique"
      - ".github/workflows/ensure-unique.yml"
      - "_data/**"
  pull_request:
    paths:
      - "Gemfile"
      - "script/ensure-unique"
      - ".github/workflows/ensure-unique.yml"
      - "_data/**"

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Ruby
      uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
      with:
        bundler-cache: true
    - name: Ensure Orgs are unique
      run: bundle exec script/ensure-unique
