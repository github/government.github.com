name: RuboCop linting
permissions:
  contents: read

on:
  push:
    paths:
      - "Gemfile"
      - ".rubocop.yml"
      - ".github/workflows/rubucop.yml"
      - "**/*.rb"
  pull_request:
    paths:
      - "Gemfile"
      - ".rubocop.yml"
      - ".github/workflows/rubucop.yml"
      - "**/*.rb"

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Ruby
      uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
      with:
        bundler-cache: true
    - name: Rubocop
      run: bundle exec rubocop -D -S
