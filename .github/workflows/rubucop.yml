name: RuboCop linting
permissions:
  contents: read

on:
  push:
    paths:
      - "Gemfile"
      - ".rubocop.yml"
      - ".github/workflows/rubucop.yml"
      - "**/*.rb"
  pull_request:
    paths:
      - "Gemfile"
      - ".rubocop.yml"
      - ".github/workflows/rubucop.yml"
      - "**/*.rb"

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Ruby
      uses: ruby/setup-ruby@984c0c890880bbf811283d6f09c4607c62d210a4 # v1.323.0
      with:
        bundler-cache: true
    - name: Rubocop
      run: bundle exec rubocop -D -S
