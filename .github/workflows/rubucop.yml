name: RuboCop linting
permissions:
  contents: read

on:
  push:
    branches: [gh-pages]
    paths:
      - "Gemfile"
      - ".rubocop.yml"
      - ".github/workflows/rubucop.yml"
      - "**/*.rb"
  pull_request:
    paths:
      - "Gemfile"
      - ".rubocop.yml"
      - ".github/workflows/rubucop.yml"
      - "**/*.rb"

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Ruby
      uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
      with:
        bundler-cache: true
    - name: Rubocop
      run: bundle exec rubocop -D -S
